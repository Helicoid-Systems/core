[package]
name = "authority-lab"
version = "0.1.0"
edition = "2021"
description = "Bounded cryptographic admission proof - development only, not production authority"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
hex = "0.4"
subtle = "2"

[dev-dependencies]
tempfile = "3"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
