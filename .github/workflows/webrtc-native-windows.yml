# Bounded native Windows x64 build + harness + C# wrapper runtime for the
# E01 WebRTC ABI-3 subset. Active owner of Windows native CI. Timeouts and
# retained library/header/wrapper/harness reports.
# Windows native acceptance remains Not Verified until this workflow completes
# on real runners.
name: webrtc-native-windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "webrtc-native/**"
      - ".github/workflows/webrtc-native-windows.yml"
  push:
    paths:
      - "webrtc-native/**"
      - ".github/workflows/webrtc-native-windows.yml"

permissions:
  contents: read

concurrency:
  group: webrtc-native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64-native:
    name: Windows x64 WebRTC harness + C# runtime
    runs-on: windows-2022
    timeout-minutes: 90
    # Hosted VS/Windows SDK + checkout Chromium clang-cl (not depot-managed
    # VS). Scripts also set these independently so local/process use is safe.
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
      DEPOT_TOOLS_UPDATE: "0"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generated header and wrapper drift checks
        timeout-minutes: 5
        run: |
          python webrtc-native/scripts/check-header.py
          if ($LASTEXITCODE -ne 0) { throw "check-header.py failed" }
          python webrtc-native/scripts/check-wrapper-contract.py
          if ($LASTEXITCODE -ne 0) { throw "check-wrapper-contract.py failed" }

      # Official Windows SDK 10.0.28000 prerequisite BEFORE costly fetch.
      # Fail-closed SHA256 + Authenticode Valid/Microsoft + file-level preflight.
      - name: Ensure official Windows SDK 28000 prerequisite
        timeout-minutes: 20
        run: |
          ./webrtc-native/scripts/install-win-sdk.ps1
          if ($LASTEXITCODE -ne 0) { throw "install-win-sdk.ps1 failed" }

      - name: Fetch pinned WebRTC checkout
        timeout-minutes: 45
        run: |
          ./webrtc-native/scripts/fetch-upstream.ps1 $env:RUNNER_TEMP/webrtc-upstream

      - name: Build bridge + shared library + harness (x64)
        timeout-minutes: 40
        run: |
          ./webrtc-native/scripts/build-windows.ps1 $env:RUNNER_TEMP/webrtc-upstream out-win-x64

      - name: Run harness and retain report
        timeout-minutes: 10
        run: |
          $out = "$env:RUNNER_TEMP/webrtc-upstream/webrtc-checkout/src/out/out-win-x64"
          $harness = Get-ChildItem -Recurse $out -Filter hs_webrtc_harness.exe | Select-Object -First 1
          if (-not $harness) { throw "harness binary not found" }
          # Binaries are already retained by build-windows.ps1; run harness and
          # record the result without gating artifact retention on exit code.
          & $harness.FullName 2>&1 | Tee-Object -FilePath webrtc-native/inventory/harness-windows.txt
          $hexit = $LASTEXITCODE
          Get-FileHash webrtc-native/inventory/hs_webrtc_harness.exe -Algorithm SHA256 |
            Format-List | Out-File -Append webrtc-native/inventory/harness-windows.txt
          if ($hexit -ne 0) { throw "harness failed" }

      - name: Setup .NET 10 SDK for C# runtime harness
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Verify DLL exports then run C# wrapper runtime
        timeout-minutes: 15
        run: |
          $out = "$env:RUNNER_TEMP/webrtc-upstream/webrtc-checkout/src/out/out-win-x64"
          $dll = Get-ChildItem -Recurse $out -Filter hs_webrtc_shared.dll | Select-Object -First 1
          if (-not $dll) { throw "hs_webrtc_shared.dll not found" }
          # Inventory copy is owned by build-windows.ps1; refresh hash only.
          Get-FileHash webrtc-native/inventory/hs_webrtc_shared.dll -Algorithm SHA256 |
            Format-List | Out-File -FilePath webrtc-native/inventory/dll-hashes-windows.txt
          # Real DLL export-table verification via pinned llvm-readobj --coff-exports
          # (LLVM CommandGuide: pe-coff-specific-options). Checked exit; fail closed.
          $readobj = Get-ChildItem -Recurse "$env:RUNNER_TEMP/webrtc-upstream/webrtc-checkout/src/third_party/llvm-build" -Filter llvm-readobj.exe | Select-Object -First 1
          if (-not $readobj) { throw "llvm-readobj.exe not found (pinned toolchain)" }
          & $readobj.FullName --coff-exports webrtc-native/inventory/hs_webrtc_shared.dll 2>&1 |
            Tee-Object -FilePath webrtc-native/inventory/dll-exports-windows.txt
          if ($LASTEXITCODE -ne 0) { throw "llvm-readobj --coff-exports failed" }
          foreach ($s in "hs_abi_version","hs_engine_init","hs_engine_shutdown","hs_peer_create","hs_verified_channel_acquire") {
            if (-not (Select-String -Path webrtc-native/inventory/dll-exports-windows.txt -SimpleMatch $s -Quiet)) {
              throw "DLL export missing: $s"
            }
          }
          Write-Host "DLL exports verified via llvm-readobj --coff-exports"
          # C# wrapper runtime against the actual Windows DLL.
          $env:PATH = "$out;$env:PATH"
          ./webrtc-native/scripts/run-csharp-runtime.ps1 $env:RUNNER_TEMP/webrtc-upstream out-win-x64 |
            Tee-Object -FilePath webrtc-native/inventory/cs-wrapper-check-windows.txt
          if ($LASTEXITCODE -ne 0) { throw "C# runtime harness failed" }

      - name: Retain library, header, wrappers, hashes, provenance, logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-native-windows-x64
          path: |
            webrtc-native/inventory/*windows*
            webrtc-native/inventory/build-provenance-out-win-x64.txt
            webrtc-native/inventory/win-sdk-pins.json
            webrtc-native/inventory/win-sdk-prereq.txt
            webrtc-native/inventory/hs_webrtc_harness.exe
            webrtc-native/inventory/hs_webrtc_shared.dll
            webrtc-native/inventory/upstream-pins.json
            webrtc-native/native/hs_webrtc.h
            webrtc-native/native/wrappers/**
          if-no-files-found: warn

      # Fail closed when produced binaries/header/provenance were not retained
      # (path handling must not silently omit outputs after a successful build).
      - name: Require retained native artifacts
        if: always()
        timeout-minutes: 2
        run: |
          $required = @(
            "webrtc-native/inventory/hs_webrtc_harness.exe",
            "webrtc-native/inventory/hs_webrtc_shared.dll",
            "webrtc-native/inventory/build-provenance-out-win-x64.txt",
            "webrtc-native/native/hs_webrtc.h"
          )
          $missing = @()
          foreach ($rel in $required) {
            $p = Join-Path $env:GITHUB_WORKSPACE $rel
            if (-not (Test-Path $p) -or (Get-Item $p).Length -le 0) {
              $missing += $rel
            }
          }
          if ($missing.Count) {
            throw "required native artifacts missing or empty: $($missing -join ', ')"
          }
          Write-Host "required native artifacts present"
