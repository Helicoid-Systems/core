name: hs-core-ci

# Independent Rust CI for the Helicoid core library.
# This workflow is scoped to the crate at modules/core and is intended to run
# from that directory as the repository root when the Helicoid core library is
# published as its own repository (Helicoid-Systems). It uses official GitHub
# checkout plus the standard Rust toolchain action and the package lockfile.

on:
  push:
    paths:
      - "**"
  pull_request:
    paths:
      - "**"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt-test-clippy:
    name: fmt / test / clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo test (locked)
        run: cargo test --locked --all-targets

      - name: cargo clippy (locked)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test development-fixtures (locked)
        run: cargo test --locked --features development-fixtures

  engine-header:
    name: isolated native header drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check retained source hash and generated header
        run: python3 engine-lab/scripts/check-header.py

  authority-proof:
    name: candidate authority proof (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: authority-lab
      - name: cargo fmt (authority-lab)
        run: cargo fmt --manifest-path authority-lab/Cargo.toml -- --check
      - name: cargo test locked (authority-lab)
        run: cargo test --locked --manifest-path authority-lab/Cargo.toml
      - name: cargo clippy locked all-targets (authority-lab)
        run: cargo clippy --locked --all-targets --manifest-path authority-lab/Cargo.toml -- -D warnings
